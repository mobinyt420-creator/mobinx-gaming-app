<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="MOBIN X - Your Ultimate Gaming Hub. Diamond Top-Up, Sensitivity Maker, Esports Tournaments, and Verified APK Downloads.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <title>Mobin X — Your Ultimate Gaming Hub</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">

  <!-- Core App Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">

  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Device Viewport Container -->
  <div class="device-viewport">
    <!-- Desktop Preview Controls -->
    <div class="desktop-controls">
      <span>Preview Mode:</span>
      <button class="active" id="btn-toggle-frame">📱 Phone</button>
      <button id="btn-toggle-full">🖥️ Full Width</button>
    </div>

    <!-- Mobile Screen Container (Phone Bezel Simulation) -->
    <div class="app-container" id="app-shell-container">
      <!-- Simulated Android Status Bar -->
      <div class="status-bar">
        <span id="status-bar-time">12:00</span>
        <div class="status-bar-icons">
          <!-- 5G Icon -->
          <svg width="14" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25C2.89 16.48 2 14.34 2 12 2 6.48 6.48 2 12 2s10 4.48 10 10c0 2.34-.89 4.48-2.35 6.25l-.62-.64C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"></path><path d="M12 7c-2.76 0-5 2.24-5 5 0 1.28.48 2.45 1.28 3.34l.71-.71C8.38 13.97 8 13.04 8 12c0-2.21 1.79-4 4-4s4 1.79 4 4c0 1.04-.38 1.97-.99 2.63l.71.71C16.52 14.45 17 13.28 17 12c0-2.76-2.24-5-5-5z"></path></svg>
          <!-- Wifi Icon -->
          <svg width="14" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"></path></svg>
          <!-- Battery Icon -->
          <svg width="15" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M17 4h-3V2h-4v2H7v18h10V4z"></path></svg>
        </div>
      </div>

      <!-- App Header Root -->
      <div id="header-root"></div>

      <!-- Scrollable Main Content -->
      <main class="app-main-content" id="app-main-content"></main>

      <!-- Bottom Navigation Root -->
      <div id="bottom-nav-root"></div>

      <!-- Navigation Drawer Root -->
      <div id="drawer-root"></div>

      <!-- Modal Root -->
      <div id="modal-root"></div>

      <!-- Global Toast Container -->
      <div class="toast-container" id="toast-root"></div>
    </div>
  </div>

  <!-- Application Logic -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
